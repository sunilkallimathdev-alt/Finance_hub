            <div class="card card-info" id="carddiv">
                <div class="card-header" data-widget="collapse" style="cursor:pointer">
                    <h3 class="card-title">ADD </h3>
                    <div class="card-tools">
                        <button type="button" class="btn btn-tool"><i class="fa fa-plus"></i></button>
                    </div>
                </div>

                <div class="card-body">
                    <div class="row">
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>Builder Name<span style="color:red">*</span></label>
                                <input class="form-control" type="text" name="Builder_Name" maxlength="100" onkeypress="return NotanHTML(event)">
                            </div>
                        </div>

                        <div class="col-md-3">
                            <div class="form-group">
                                <label>License No.<span style="color:red">*</span></label>
                                <input class="form-control" type="text" name="License_Number" maxlength="100" onkeypress="return NotanHTML(event)">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>Affliation<span style="color:red">*</span></label>
                                <input class="form-control" type="text" name="Affliation" maxlength="100" onkeypress="return NotanHTML(event)">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>Office Address<span style="color:red">*</span></label>
                                <textarea class="form-control" type="text" name="Office_Address" maxlength="1000" onkeypress="return NotanHTML(event)"></textarea>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>Landline<span style="color:red"></span></label>
                                <input class="form-control" type="text" name="Landline" maxlength="15" onkeypress="return NotanHTML(event)">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>Cell 1<span style="color:red">*</span></label>
                                <input class="form-control" type="text" name="Cell1" maxlength="15" onkeypress="return IsNumeric(event)">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>Cell 2<span style="color:red"></span></label>
                                <input class="form-control" type="text" name="Cell2" maxlength="15" onkeypress="return IsNumeric(event)">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>Fax<span style="color:red"></span></label>
                                <input class="form-control" type="text" name="Fax" maxlength="15" onkeypress="return NotanHTML(event)">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">

                                <label>EmailID<span style="color:red">*</span></label>
                                <input class="form-control" type="text" name="EmailID" maxlength="100" onkeypress="return NotanHTML(event)">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>Password<span style="color:red">*</span></label>
                                <input class="form-control" type="password" name="Password" maxlength="20" onkeypress="return NotanHTML(event)">
                            </div>
                        </div>

                        <div class="col-md-3">
                            <div class="form-group">
                                <label>No Of Users<span style="color:red">*</span></label>
                                <div class="input-group input-group-sm">
                                    <input type="text" name="NumberOfsers" onkeypress="return NotanHTML(event)" class="form-control">
                                    <span class="input-group-btn">
                                        <button type="button" onclick="showRoles();" class="btn btn-info btn-flat">Click</button>
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>Status<span style="color:red">*</span></label>
                                <select class="form-control" name="IsActive">
                                    <option value="true">Active</option>
                                    <option value="false">InActive</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="row" id="No_of_users_div">
                        <table style="width:100%">

                                </tr>
                            </thead>
                            <tbody id="tbody">
                             
                            </tbody>

                    </div>

                    <button type="button" class="btn btn-danger" onclick="ClearFields()" id="btnreset">Cancel</button>
                    <input type="hidden" name="HDID" />

        $(function () {
            //Initialize Select2 Elements
            $('.select2').select2();
            CloseCard();
        });
        function OpenCard() {
            $('#carddiv').removeClass('collapsed-card');
            $('html, body').animate({ scrollTop: 0 }, 'fast');
            $('.fa-plus').addClass('fa-minus').removeClass('fa-plus')
        }
        function CloseCard() {
            $('#carddiv').addClass('collapsed-card');
            $('.fa-minus').addClass('fa-plus').removeClass('fa-minus')
        }
        function SuccessAlert(Title, Message) {
            toastr.success(Message, Title)
        }
        function WarningAlert(Title, Message) {
            toastr.warning(Message, Title)
        }
        function DangerAlert(Title, Message) {
            toastr.error(Message, Title)
        }
